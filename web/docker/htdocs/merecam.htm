<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <meta name="keywords" content="Budworth Sailing Club weather data, weather, data, weather station, steelseries">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budworth Sailing Club Live MereCam</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link href="bsc/theme_budworth.css" rel="stylesheet" type="text/css" />
    <link href="bsc/bscstyle.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css"
        integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
    <!-- this stylesheet is for the Steelseries Gauges-->

</head>

<body>
    <div class="container-fluid bscbody pb-2">
        <header>
            <div class="container-fluid bg-primary bsctitles" hidden>  
            </div>
            <nav class="navbar navbar-expand-md navbar-dark bg-danger">
                <a class="navbar-brand" href="#">Budworth TV</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse"
                    data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="index.htm">Now</a></li>
                    </ul>
                </div>
            </nav>
        </header>
        <section>
            <div class="container-fluid bg-primary p-1 d-flex">
                <!-- use this container to show the status of the stream-->
                <div id="healthyicon" class="p-1 text-success" >
                    <i class="fas fa-heartbeat"></i>
                </div>
                <div id="unhealthyicon" class="p-1 text-danger" >
                    <i class="fas fa-heart-broken"></i>
                </div>
                <div id="streamicon" class="p-1 text-info" >
                    <i class="fas fa-tachometer-alt"></i>
                    kBps
                </div>
                <div id="streamrate" class="p-1 text-info" >
                </div>
                <!-- Responsive: Marquee - Scroll on small screens-->
                <div class="p-1 flex-grow-1 text-light marquee-container">
                    <span id="banner" class="marquee-text"> </span>
                </div>
            </div>
            <div class="container-fluid bg-light p-2">
                <video class="embed-responsive embed-responsive-16by9" id="merewebcam" autoplay muted playsinline>
                </video>
            </div>
        </section>
        <footer>
        </footer>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
    <script type="module" src="js/playstream.js"></script> 

</body>

</html>
